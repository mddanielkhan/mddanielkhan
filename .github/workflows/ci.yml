name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · types · tests · build · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shikor
          POSTGRES_PASSWORD: shikor
          POSTGRES_DB: shikor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shikor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shikor:shikor@localhost:5432/shikor_test
      DATABASE_URL_E2E: postgres://shikor:shikor@localhost:5432/shikor_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Supply-chain gate — no high/critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations apply cleanly to an empty database
        run: |
          PGPASSWORD=shikor psql -h localhost -U shikor -d shikor_test -c "create database shikor_e2e"
          npx tsx scripts/migrate.ts
      - name: Unit + integration tests with coverage gates
        run: npm run test:coverage
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the production build
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
